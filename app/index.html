<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChinaFastLane</title>
    <script>
      (function () {
        try {
          var theme = window.localStorage.getItem('theme');
          var isDark = theme ? theme === 'dark' : true;
          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.style.background = isDark
            ? 'radial-gradient(ellipse at center, #0F1D32 0%, #0A1628 50%, #060E1A 100%)'
            : 'radial-gradient(ellipse at center, #F8FAFC 0%, #F0F2F5 50%, #E8ECF0 100%)';
        } catch (e) {
          // ignore storage errors
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
