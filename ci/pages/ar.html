<h1>أخبار اليوم</h1>
<p>يتوقع أن يكون الطقس مشمسا اليوم في المدينة وأن ترتفع درجة الحرارة إلى عشرين درجة.</p>
<div class="msg">مرحبا كيف حالك؟ هل ستأتي إلى الاجتماع مساء اليوم؟</div>
<div class="msg">نعم بالتأكيد سأكون هناك في الساعة السابعة.</div>
<p>اضغط على الزر أدناه للمتابعة.</p>
