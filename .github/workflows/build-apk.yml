name: Build APK

on:
  push:
    paths-ignore:
      - 'ci-output/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # ubuntu-latest already ships the Android SDK in $ANDROID_HOME.
      - name: Build
        id: build
        continue-on-error: true
        run: |
          chmod +x gradlew
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          set -o pipefail
          ./gradlew assembleDebug testDebugUnitTest lintDebug --stacktrace --no-daemon 2>&1 | tee build.log
      - name: Publish build output to the branch
        if: always()
        run: |
          mkdir -p ci-output
          tail -c 400000 build.log > ci-output/build.log || true
          cp app/build/outputs/apk/debug/app-debug.apk ci-output/ScreenTranslate.apk 2>/dev/null || true
          cp app/build/reports/lint-results-debug.txt ci-output/ 2>/dev/null || true
          mkdir -p ci-output/test-results && cp app/build/test-results/testDebugUnitTest/*.xml ci-output/test-results/ 2>/dev/null || true
          echo "${{ steps.build.outcome }}" > ci-output/STATUS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci-output
          git commit -m "CI build output (${{ steps.build.outcome }})" || exit 0
          git push
      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
