name: Build APK

on:
  push:
    paths-ignore:
      - 'ci-output/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # ubuntu-latest already ships the Android SDK in $ANDROID_HOME.
      - name: Build
        id: build
        continue-on-error: true
        run: |
          chmod +x gradlew
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          set -o pipefail
          ./gradlew assembleRelease testReleaseUnitTest lintRelease --stacktrace --no-daemon 2>&1 | tee build.log
      - name: Keep phone APK, build emulator APK (adds x86_64)
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p ci-output
          cp app/build/outputs/apk/release/app-release.apk ci-output/MuinScreenTranslator.apk
          ./gradlew assembleRelease -PwithX86 -PtestLogs --no-daemon -q
      - name: Enable KVM
        if: steps.build.outcome == 'success'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator test
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/emulator-test.sh
      - name: Publish build output to the branch
        if: always()
        run: |
          mkdir -p ci-output
          tail -c 400000 build.log > ci-output/build.log || true
          [ -f ci-output/MuinScreenTranslator.apk ] || cp app/build/outputs/apk/release/app-release.apk ci-output/MuinScreenTranslator.apk 2>/dev/null || true
          cp app/build/reports/lint-results-release.txt ci-output/ 2>/dev/null || true
          mkdir -p ci-output/test-results && cp app/build/test-results/testReleaseUnitTest/*.xml ci-output/test-results/ 2>/dev/null || true
          echo "${{ steps.build.outcome }}" > ci-output/STATUS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci-output
          git commit -q -m "CI build output (${{ steps.build.outcome }})" || exit 0
          for i in 1 2 3 4; do
            git pull --rebase -q -X theirs origin "${GITHUB_REF_NAME}" && git push -q && exit 0
            sleep 5
          done
          exit 1
      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
